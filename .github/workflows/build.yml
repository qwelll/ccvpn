name: Build roothide deb

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    # macos-14+ 自带完整 Xcode 与 Homebrew, 满足 roothide Theos 安装要求
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Install Theos (roothide)
        timeout-minutes: 40
        run: |
          export THEOS="$HOME/theos"
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos)"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Show SDKs
        run: |
          ls -la "$THEOS/sdks" || true
          for s in "$THEOS"/sdks/*.sdk; do
            echo "== $s"
            ls "$s/System/Library/PrivateFrameworks" | grep -Ei 'ControlCenterUIKit|Preferences' || echo "(missing private frameworks)"
          done

      - name: Create stub tbds for missing private frameworks
        run: |
          # roothide 的 iPhoneOS16.5 SDK 缺 Preferences / ControlCenterUIKit 的 .tbd,
          # 生成的桩 tbd 无导出符号, 仅用于 ld 找到框架, 运行时由系统真实框架提供。
          bash ci/make-stub-tbd.sh Preferences ControlCenterUIKit
          ls -l "$THEOS/sdks/iPhoneOS16.5.sdk/System/Library/PrivateFrameworks/ControlCenterUIKit.framework"

      - name: Build roothide deb
        run: |
          make clean || true
          # 打印真实链接命令便于诊断
          make package THEOS_PACKAGE_SCHEME=roothide ARCHS=arm64e FINALPACKAGE=1 V=1 || {
            echo '--- retry with explicit framework path ---';
            grep -rn 'framework' .theos/obj/*/VPNNodeSelector.bundle/*.LinkFileList 2>/dev/null | head;
            exit 1;
          }

      - name: Verify package
        run: |
          ls -la packages/
          for f in packages/*.deb; do
            echo "===== $f"
            dpkg-deb -I "$f" | sed -n '1,20p'
            dpkg-deb -c "$f"
            dpkg-deb -x "$f" /tmp/x
            find /tmp/x -type f \( -name '*.dylib' -o -name '*.plist' \) -maxdepth 8 | head -40
          done

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: VPNNodeSelector-roothide-deb
          path: packages/*.deb
          if-no-files-found: error
